<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ox Forelimb 3D Viewer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #10151c; }
    #viewer { width: 100%; height: 100%; }
    #status { position: fixed; left: 18px; top: 16px; z-index: 2; padding: 10px 14px; border-radius: 10px; background: #17212cdd; color: #eaf2f8; font-size: 14px; }
    #help { position: fixed; right: 18px; bottom: 16px; z-index: 2; padding: 9px 12px; border-radius: 9px; background: #17212ccc; color: #c8d5df; font-size: 13px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="viewer" aria-label="Interactive ox forelimb model"></div>
  <div id="status">Loading ox forelimb…</div>
  <div id="help">Drag: rotate · Wheel: zoom · Right-drag: pan</div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const MODEL = 'https://raw.githubusercontent.com/drsahuvet/OX-MODEL/main/Ox_Forelimb_Sketchfab_FBX.glb';
    const host = document.querySelector('#viewer');
    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf1f3f5);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(2.6, 1.8, 4.1);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    host.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.screenSpacePanning = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x536273, 2.2));
    const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(3, 5, 4); scene.add(key);
    const fill = new THREE.DirectionalLight(0x9ecbff, 0.8); fill.position.set(-4, 2, -3); scene.add(fill);

    new GLTFLoader().load(MODEL, ({scene: model}) => {
      scene.add(model);
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3()).length();
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(size * .65, size * .38, size * .85));
      camera.near = Math.max(size / 1000, 0.001); camera.far = size * 20; camera.updateProjectionMatrix();
      controls.update();
      status.textContent = 'Ox forelimb model ready';
      setTimeout(() => status.remove(), 2400);
    }, xhr => {
      if (xhr.total) status.textContent = `Loading ox forelimb… ${Math.round(xhr.loaded / xhr.total * 100)}%`;
    }, () => { status.textContent = 'Unable to load the model'; });

    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    addEventListener('contextmenu', e => e.preventDefault());
    addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['s','u'].includes(e.key.toLowerCase())) e.preventDefault(); });
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
  </script>
</body>
</html>
